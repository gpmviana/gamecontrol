<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta de treinador · Game Control</title><style>:root{color-scheme:dark;font-family:'Segoe UI',system-ui,sans-serif;background:#171c22;color:#e7edf3}*{box-sizing:border-box}body{margin:0;padding:28px 18px}main{max-width:640px;margin:28px auto;padding:28px;border:1px solid #bfd8eb26;border-radius:16px;background:#bfd8eb08}h1{font-weight:600;font-size:26px}p{color:#a2afbc;line-height:1.6}label{display:block;margin:16px 0 6px;font-size:13px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #bfd8eb30;background:#bfd8eb12;color:#e7edf3}input{width:100%}button{cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.45;cursor:default}a{color:#bfd8eb}#status{white-space:pre-line;padding:14px 0;font-size:14px;color:#bfd8eb}.row{border:1px solid #bfd8eb26;padding:16px;border-radius:10px;margin:12px 0}.row h2{font-size:17px}.row p{font-size:13px;overflow-wrap:anywhere}select{font:inherit;padding:8px;background:#26343e;color:white;border-radius:6px}input:focus-visible,button:focus-visible{outline:2px solid #bfd8eb;outline-offset:3px}[hidden]{display:none!important}</style></head><body><main><a href="app.html">← Voltar à aplicação</a><h1>Criar conta de treinador</h1><p>Cria a conta, confirma o teu endereço de email e aguarda a aprovação. Os teus jogos e equipas serão privados.</p><form id="form"><label for="name">Nome</label><input id="name" maxlength="100" autocomplete="name"><label for="club">Clube</label><input id="club" maxlength="120" autocomplete="organization"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Palavra-passe</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button id="create" type="submit">Criar conta e pedir aprovação</button><button id="login" type="button">Já criei conta · consultar pedido</button></form><div id="verification" hidden><button id="resend">Reenviar confirmação de email</button><button id="check">Já confirmei · atualizar estado</button><button id="leave">Sair desta conta</button></div><p>A conta não dá acesso até ser aprovada. Não guardamos a palavra-passe no perfil do treinador.</p><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="registar.js"></script></body></html>
